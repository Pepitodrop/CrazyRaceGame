name: Bug report
description: Report reproducible incorrect behavior in Crazy Race
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include secrets, access tokens, private hostnames, or personal data.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, commit SHA, or branch used
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      options:
        - Online room
        - Local pass-and-play
        - Startup or deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Docker version, and deployment method
      placeholder: Firefox on Linux; Docker Compose production profile
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that demonstrates the problem
      placeholder: |
        1. Create a room
        2. Join from a second browser
        3. Submit Drift
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove room tokens, IP addresses, hostnames, and other sensitive values before posting
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets, tokens, private addresses, and personal data.
          required: true
        - label: This is not a security vulnerability; vulnerabilities are reported privately through SECURITY.md.
          required: true
