name: Apply gameplay clarity migration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply gameplay core changes
        run: python3 tools/apply_gameplay_core.py

      - name: Apply gameplay page changes
        run: python3 tools/apply_gameplay_ui4.py

      - name: Apply gameplay styles and tests
        run: python3 tools/apply_gameplay_ui5.py

      - name: Apply Docker, CI, and version changes
        run: python3 tools/apply_gameplay_ops.py

      - name: Apply documentation and cleanup
        run: python3 tools/apply_gameplay_docs.py

      - name: Install formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.82.0
          components: rustfmt

      - name: Format and commit generated changes
        run: |
          set -euo pipefail
          rustfmt --edition 2021 src/*.rs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Improve gameplay clarity and Snap Docker compatibility"
          git push origin HEAD:${{ github.head_ref }}
