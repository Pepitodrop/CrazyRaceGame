name: Apply gameplay clarity migration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply gameplay core changes
        run: python3 tools/apply_gameplay_core.py
      - name: Apply gameplay page changes
        run: python3 tools/apply_gameplay_ui4.py
      - name: Apply gameplay styles and tests
        run: python3 tools/apply_gameplay_ui5.py
      - name: Apply Docker, CI, and version changes
        run: python3 tools/apply_gameplay_ops.py
      - name: Apply documentation and cleanup
        run: python3 tools/apply_gameplay_docs.py
      - name: Fix Piet SVG raw-string delimiter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/part4.rs')
          text = path.read_text()
          text = text.replace('r#"<details class="card piet-easter-egg">', 'r##"<details class="card piet-easter-egg">', 1)
          text = text.replace('</details>"#.to_string()', '</details>"##.to_string()', 1)
          path.write_text(text)
          PY
      - name: Restore migration and workflow files
        run: |
          git checkout HEAD -- tools .github/workflows/apply-gameplay-v110.yml .github/workflows/ci.yml
      - name: Install formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.82.0
          components: rustfmt
      - name: Format generated Rust
        run: rustfmt --edition 2021 src/*.rs
      - name: Validate generated diff
        run: git diff --check
      - name: Commit generated changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Improve gameplay clarity and Snap Docker compatibility"
      - name: Push generated changes
        run: git push origin HEAD:${{ github.head_ref }}
