name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
      - name: Test Rust engine
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Build Docker image
        id: docker_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain -t crazy-race-game:ci . 2>&1 | tee docker-build.log
      - name: Upload Docker build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log
          path: docker-build.log
      - name: Stop after Docker build failure
        if: steps.docker_build.outcome != 'success'
        run: exit 1
      - name: Verify original TrumpScript interpreter
        id: trumpscript_runtime
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --entrypoint /opt/trumpscript/bin/TRUMP \
            crazy-race-game:ci --shut-up /app/announcer/race.tr 2>&1 | tee trumpscript-runtime.log
          test -s trumpscript-runtime.log
      - name: Upload TrumpScript runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trumpscript-runtime-log
          path: trumpscript-runtime.log
      - name: Stop after TrumpScript runtime failure
        if: steps.trumpscript_runtime.outcome != 'success'
        run: exit 1
      - name: Smoke-test container
        run: |
          docker run -d --name crazy-race-ci -p 18080:8080 crazy-race-game:ci
          trap 'docker logs crazy-race-ci; docker rm -f crazy-race-ci' EXIT
          for attempt in $(seq 1 20); do
            if docker exec crazy-race-ci crazy-race-game --healthcheck; then
              exit 0
            fi
            sleep 1
          done
          exit 1
