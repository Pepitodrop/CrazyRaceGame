name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify public release hygiene
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            LICENSE
            README.md
            CHANGELOG.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            THIRD_PARTY_NOTICES.md
            docs/PRODUCTION.md
            docs/RELEASING.md
          )
          for file in "${required_files[@]}"; do
            test -s "$file" || { echo "Missing required public-release file: $file"; exit 1; }
          done

          version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          test -n "$version"
          grep -Fq "version = \"$version\"" Cargo.lock
          grep -Fq "## [$version]" CHANGELOG.md

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${version}" || {
              echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${version}."
              exit 1
            }
          fi

          tracked_sensitive="$({
            git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key|p12|pfx)$' || true
          } | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$tracked_sensitive" ]]; then
            echo "Sensitive local files are tracked:"
            echo "$tracked_sensitive"
            exit 1
          fi

          high_confidence_secret_pattern='-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|xox[baprs]-[A-Za-z0-9-]{10,}'
          if git grep -nE -e "$high_confidence_secret_pattern" -- .; then
            echo "A high-confidence secret pattern was found in the tracked tree."
            exit 1
          fi

          ruby -e 'require "yaml"; Dir[".github/**/*.{yml,yaml}"].sort.each { |file| YAML.load_file(file); puts "valid yaml: #{file}" }'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.82.0
          components: clippy,rustfmt

      - name: Normalize Rust formatting
        run: rustfmt --edition 2021 src/*.rs

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test Rust engine
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Validate production Compose
        run: docker compose -f compose.production.yml config --quiet

      - name: Build Docker image
        run: docker build -t crazy-race-game:ci .

      - name: Verify image metadata and non-root runtime
        shell: bash
        run: |
          version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          test "$(docker image inspect crazy-race-game:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect crazy-race-game:ci --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$version"
          test "$(docker image inspect crazy-race-game:ci --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = "MIT"

      - name: Verify original TrumpScript interpreter
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --entrypoint /opt/trumpscript/bin/TRUMP \
            crazy-race-game:ci --shut-up /app/announcer/race.tr | tee /tmp/announcer.txt
          test -s /tmp/announcer.txt

      - name: Smoke-test hardened container
        shell: bash
        run: |
          docker run -d --name crazy-race-ci \
            -p 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 256m \
            --cpus 1 \
            crazy-race-game:ci
          trap 'docker logs crazy-race-ci; docker rm -f crazy-race-ci' EXIT
          for attempt in $(seq 1 30); do
            if docker exec crazy-race-ci crazy-race-game --healthcheck; then
              bash scripts/smoke-test.sh http://127.0.0.1:18080
              exit 0
            fi
            sleep 1
          done
          exit 1
