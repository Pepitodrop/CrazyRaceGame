name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify public release hygiene
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            LICENSE
            README.md
            CHANGELOG.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            THIRD_PARTY_NOTICES.md
            docs/PRODUCTION.md
            docs/RELEASING.md
          )
          for file in "${required_files[@]}"; do
            test -s "$file" || { echo "Missing required public-release file: $file"; exit 1; }
          done

          version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          test -n "$version"
          grep -Fq "version = \"$version\"" Cargo.lock
          grep -Fq "## [$version]" CHANGELOG.md
          test -s "docs/RELEASE_NOTES_v${version}.md"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${version}" || {
              echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${version}."
              exit 1
            }
          fi

          tracked_sensitive="$({
            git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key|p12|pfx)$' || true
          } | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$tracked_sensitive" ]]; then
            echo "Sensitive local files are tracked:"
            echo "$tracked_sensitive"
            exit 1
          fi

          high_confidence_secret_pattern='-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|xox[baprs]-[A-Za-z0-9-]{10,}'
          if git grep -nE -e "$high_confidence_secret_pattern" -- .; then
            echo "A high-confidence secret pattern was found in the tracked tree."
            exit 1
          fi

          ruby -e 'require "yaml"; Dir[".github/**/*.{yml,yaml}"].sort.each { |file| YAML.load_file(file); puts "valid yaml: #{file}" }'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.82.0
          components: clippy,rustfmt

      - name: Normalize Rust formatting
        run: rustfmt --edition 2021 src/*.rs

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test Rust engine
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Validate Compose profiles
        run: |
          docker compose config --quiet
          docker compose -f compose.production.yml config --quiet

      - name: Build Docker image
        run: docker build -t crazy-race-game:ci .

      - name: Verify image metadata and non-root runtime
        shell: bash
        run: |
          version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          test "$(docker image inspect crazy-race-game:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect crazy-race-game:ci --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$version"
          test "$(docker image inspect crazy-race-game:ci --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = "MIT"

      - name: Verify original TrumpScript interpreter
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --entrypoint /opt/trumpscript/bin/TRUMP \
            crazy-race-game:ci --shut-up /app/announcer/race.tr | tee /tmp/announcer.txt
          test -s /tmp/announcer.txt

      - name: Smoke-test local and production Compose profiles
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            HOST_PORT=18081 docker compose -p crazy-race-local-ci down -v --remove-orphans || true
            HOST_PORT=18082 docker compose -p crazy-race-production-ci -f compose.production.yml down -v --remove-orphans || true
          }
          trap cleanup EXIT

          wait_for_health() {
            local project="$1"
            local compose_file="$2"
            for attempt in $(seq 1 45); do
              if HOST_PORT="$3" docker compose -p "$project" -f "$compose_file" \
                exec -T crazy-race crazy-race-game --healthcheck; then
                return 0
              fi
              sleep 1
            done
            HOST_PORT="$3" docker compose -p "$project" -f "$compose_file" ps
            HOST_PORT="$3" docker compose -p "$project" -f "$compose_file" logs
            return 1
          }

          HOST_PORT=18081 docker compose -p crazy-race-local-ci up -d --build
          wait_for_health crazy-race-local-ci docker-compose.yml 18081
          bash scripts/smoke-test.sh http://127.0.0.1:18081
          HOST_PORT=18081 docker compose -p crazy-race-local-ci down -v --remove-orphans

          HOST_PORT=18082 docker compose -p crazy-race-production-ci -f compose.production.yml up -d --build
          wait_for_health crazy-race-production-ci compose.production.yml 18082
          bash scripts/smoke-test.sh http://127.0.0.1:18082
