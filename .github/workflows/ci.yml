name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.82.0
          components: clippy,rustfmt

      - name: Normalize Rust formatting
        run: rustfmt --edition 2021 src/*.rs

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test Rust engine
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Validate production Compose
        run: docker compose -f compose.production.yml config --quiet

      - name: Build Docker image
        run: docker build -t crazy-race-game:ci .

      - name: Verify non-root runtime
        run: test "$(docker image inspect crazy-race-game:ci --format '{{.Config.User}}')" = "10001:10001"

      - name: Verify original TrumpScript interpreter
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --entrypoint /opt/trumpscript/bin/TRUMP \
            crazy-race-game:ci --shut-up /app/announcer/race.tr | tee /tmp/announcer.txt
          test -s /tmp/announcer.txt

      - name: Smoke-test hardened container
        shell: bash
        run: |
          docker run -d --name crazy-race-ci \
            -p 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 256m \
            --cpus 1 \
            crazy-race-game:ci
          trap 'docker logs crazy-race-ci; docker rm -f crazy-race-ci' EXIT
          for attempt in $(seq 1 30); do
            if docker exec crazy-race-ci crazy-race-game --healthcheck; then
              bash scripts/smoke-test.sh http://127.0.0.1:18080
              exit 0
            fi
            sleep 1
          done
          exit 1
