services:
  crazy-race:
    build:
      context: .
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      TRACK_SEED: "${TRACK_SEED:-42}"
      MAX_CONNECTIONS: "${MAX_CONNECTIONS:-128}"
      MAX_ROOMS: "${MAX_ROOMS:-1000}"
      ROOM_TTL_SECONDS: "${ROOM_TTL_SECONDS:-7200}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    # The local profile intentionally omits no-new-privileges because Snap Docker's
    # AppArmor policy rejects container exec with that flag. The production profile
    # keeps the stronger restriction and should run on Docker Engine or Docker Desktop.
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
